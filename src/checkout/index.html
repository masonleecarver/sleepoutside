<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>

  </head>

  <body>
    <header class="divider" id="main-header">
    </header>

    <main class="divider">
      <h2>Review & Place your Order</h2>
      <section class="checkout-form">        
        <form name="checkout">
        <input type="hidden" name="orderDate" id="orderDate">

        <fieldset>
          <legend>Personal Info</legend>
          <div class="checkout__name">
            <label for="fname">First Name: <input type="text" name="fname" id="fname" required></label>
            <label for="lname">Last Name: <input type="text" name="lname" id="lname" required></label>
            
          </div>
          <div class="checkout__address">
            <label for="street">Street Address: <input type="text" name="street" id="street" required></label>
            
            <label for="city">City: <input type="text" name="city" id="city" required></label>
            
            <label for="state">State: <input type="text" name="state" id="state" required></label>
            
            <label for="zip">Zip: <input type="text" name="zip" id="zip" required></label>
            
          </div>
        </fieldset>

        <fieldset>
          <legend>Payment</legend>
          <div class="checkout__payment">
            <label for="cardNumber">Card Number: <input type="text" name="cardNumber" id="cardNumber" required></label>
            
            <label for="expiration">Expiration: <input type="text" name="expiration" id="expiration" required></label>
            
            <label for="code">CVV: <input type="text" name="code" id="code" required></label>
            
          </div>
        </fieldset>

        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>

          <div class="order__summary">
            <div>Items: <span id="num-items"></span></div>
            <div>Subtotal: <span id="cartTotal"></span></div>
            <div>Tax <span id="tax"></span></div>
            <div>Shipping: <span id="shipping"></span></div>
            <div>Total: <span id="orderTotal"></span></div>
          </div>
        </fieldset>
        <button type="submit" id="checkoutSubmit">Checkout</button>
      </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
