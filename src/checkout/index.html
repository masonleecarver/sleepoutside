<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header">
    </header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <div class="checkout-review">
          <p class="subtotal"></p>
          <p class="tax"></p>
          <p class="shipping"></p>
          <p class="total"></p>
        </div>
        <form method="get" class="checkout-form">
          <fieldset>
            <legend>Name</legend>
            <label>First: <input type="text" name="first-name" id="first-name" required></label>
            <label>Last: <input type="text" name="last-name" id="last-name" required></label>
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label>Street Address: <input type="text" name="street-address" id="street-address" required></label>
            <label>City: <input type="text" name="city" id="city" required></label>
            <label>State: <input type="text" name="state" id="state" required></label>
            <label>Zip Code: <input type="number" name="zip" id="zip" required></label>
          </fieldset>

          <fieldset>
            <legend>Payment Method</legend>
            <label>Credit Card Number: <input type="number" name="card-number" id="card-number" required></label>
            <label>Expiration Date: <input type="date" name="exp-date" id="exp-date" required></label>
            <label>Security Code: <input type="number" name="code" id="code" required></label>
          </fieldset>

          <button type="submit">Checkout</button>

        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
